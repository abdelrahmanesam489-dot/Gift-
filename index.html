<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            max-width: 400px;
            margin: auto;
            border: 2px solid #d4af37;
        }
        h1 { color: #d4af37; }
        p { font-size: 20px; line-height: 1.6; }
        .sig { margin-top: 30px; font-weight: bold; color: #aaa; }
        .btn {
            display: inline-block;
            margin-top: 25px;
            background: #25d366;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="name">جاري تحميل الهدية...</h1>
        <p id="message"></p>
        <div class="sig" id="signature"></div>
        <a id="whatsapp" href="#" class="btn" target="_blank" style="display:none;">تواصل عبر واتساب</a>
    </div>

    <script>
        async function loadGift() {
            try {
                // بيدور على ملف data.json اللي إنت رافعه ويقرا منه البيانات أوتوماتيك
                const response = await fetch('data.json');
                const data = await response.json();

                document.getElementById('name').innerText = data.n || "هدية لك";
                document.getElementById('message').innerText = data.m || "";
                document.getElementById('signature').innerText = data.sig ? "توقيع: " + data.sig : "";
                
                if (data.wa) {
                    const waBtn = document.getElementById('whatsapp');
                    waBtn.href = "https://wa.me/" + data.wa;
                    waBtn.style.display = "inline-block";
                }
            } catch (error) {
                document.getElementById('name').innerText = "خطأ في تحميل البيانات";
            }
        }
        loadGift();
    </script>
</body>
</html>
