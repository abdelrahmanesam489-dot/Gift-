<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>هدية خاصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--text);font-family:var(--font-body);overflow-x:hidden;-webkit-text-size-adjust:100%}

/* ===== الستايلات (كل ستايل = مجموعة ألوان وخطوط) ===== */
body[data-style="gold"]{
  --text:#f6ecd2;--accent:#d9b45b;--font-title:'Amiri',serif;--font-body:'Amiri',serif;
  --veil:linear-gradient(180deg,rgba(12,8,2,.70),rgba(12,8,2,.38) 50%,rgba(12,8,2,.82));
  --cover:radial-gradient(ellipse at 50% 35%,#2a1e08,#0b0803 70%);
  --btn-bg:linear-gradient(180deg,#e6c46d,#b88a2c);--btn-text:#1b1304;--panel:transparent;
}
body[data-style="rose"]{
  --text:#fff0f4;--accent:#ffb8cc;--font-title:'Aref Ruqaa',serif;--font-body:'Aref Ruqaa',serif;
  --veil:linear-gradient(180deg,rgba(70,12,40,.58),rgba(70,12,40,.28) 50%,rgba(70,12,40,.70));
  --cover:radial-gradient(ellipse at 50% 35%,#5a1a38,#1d0814 72%);
  --btn-bg:linear-gradient(180deg,#ffc9d9,#f48fb1);--btn-text:#4a0f2a;--panel:rgba(255,240,244,.10);
}
body[data-style="dark"]{
  --text:#ececec;--accent:#ffffff;--font-title:'Cairo',sans-serif;--font-body:'Cairo',sans-serif;
  --veil:linear-gradient(180deg,rgba(0,0,0,.66),rgba(0,0,0,.50) 50%,rgba(0,0,0,.80));
  --cover:radial-gradient(ellipse at 50% 35%,#1b1b1d,#050505 72%);
  --btn-bg:#ffffff;--btn-text:#111;--panel:transparent;
}
body[data-style="party"]{
  --text:#ffffff;--accent:#ffd23f;--font-title:'Lalezar','Cairo',sans-serif;--font-body:'Cairo',sans-serif;
  --veil:linear-gradient(160deg,rgba(120,20,140,.55),rgba(255,90,60,.22) 55%,rgba(20,90,200,.55));
  --cover:linear-gradient(160deg,#6a1b9a,#e8453c 55%,#1e5bd8);
  --btn-bg:linear-gradient(180deg,#ffe066,#ff9f1c);--btn-text:#3a1500;--panel:rgba(255,255,255,.10);
}

/* ===== الخلفية ===== */
.bg{position:fixed;inset:0;z-index:0;background:#000 center/cover no-repeat}
#bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity 1.2s ease}
#bgVideo.on{opacity:1}
.veil{position:fixed;inset:0;z-index:1;background:var(--veil);pointer-events:none}
body[data-style="gold"] .frame{position:fixed;inset:12px;z-index:2;border:1px solid var(--accent);opacity:.55;pointer-events:none}
body[data-style="gold"] .frame::after{content:"";position:absolute;inset:5px;border:1px solid var(--accent);opacity:.5}
#confetti{position:fixed;inset:0;z-index:3;pointer-events:none}

/* ===== المحتوى ===== */
.content{position:relative;z-index:4;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  padding-block:max(44px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-bottom));
  padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
.head{display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font-family:var(--font-title);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.3;text-wrap:balance;color:var(--text);text-shadow:0 2px 18px rgba(0,0,0,.45)}
.rule{width:64px;height:1px;background:var(--accent);opacity:.8}
.days{font-size:15px;color:var(--accent);min-height:1.4em;opacity:0;transition:opacity 1s ease}
.days.on{opacity:1}
.msg-wrap{width:100%;max-width:620px;padding:18px 16px;border-radius:18px;background:var(--panel)}
body[data-style="rose"] .msg-wrap,body[data-style="party"] .msg-wrap{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.message{font-family:var(--font-body);font-size:clamp(19px,4.6vw,25px);line-height:2.1;white-space:pre-wrap;color:var(--text);text-shadow:0 1px 14px rgba(0,0,0,.5);min-height:4em}
.message .caret{display:inline-block;width:2px;height:1.1em;margin-inline-start:3px;vertical-align:-.15em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.foot{display:flex;flex-direction:column;align-items:center;gap:14px}
.music{font-family:var(--font-body);font-size:15px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:var(--text);border-radius:999px;padding:11px 22px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.music:focus-visible,.btn:focus-visible,.pw input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sig{font-family:'Cairo',sans-serif;font-size:11.5px;line-height:1.8;color:var(--text);opacity:.62}
.sig a{color:inherit;text-decoration:underline;text-underline-offset:3px}

/* ===== شاشة الفتح + كلمة السر ===== */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  background:var(--cover);padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  transition:opacity .9s ease,visibility .9s}
.screen.cover-img::before{content:"";position:absolute;inset:0;background:var(--poster) center/cover;filter:blur(14px) brightness(.45);transform:scale(1.08);z-index:-1}
.screen.hide{opacity:0;visibility:hidden;pointer-events:none}
.screen .to{font-family:var(--font-title);font-size:clamp(26px,7vw,38px);color:var(--text);line-height:1.4;text-wrap:balance;max-width:560px}
.screen .sub{font-family:'Cairo',sans-serif;font-size:14px;color:var(--text);opacity:.75}
.gift{width:92px;height:92px;color:var(--accent)}
.btn{font-family:var(--font-body);font-size:19px;font-weight:700;color:var(--btn-text);background:var(--btn-bg);border:0;border-radius:999px;padding:14px 38px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.35);position:relative}
.btn::after{content:"";position:absolute;inset:-7px;border-radius:999px;border:1px solid var(--accent);opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(.96)}100%{opacity:0;transform:scale(1.16)}}
.pw{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
.pw input{font:inherit;font-size:17px;text-align:center;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:var(--text)}
.pw .err{min-height:1.3em;font-family:'Cairo',sans-serif;font-size:14px;color:#ffb4a8}
.pw .btn{padding:12px 20px;font-size:17px}
.pw .btn::after{display:none}
.notice{font-family:'Cairo',sans-serif;font-size:17px;line-height:1.9;color:#ddd;max-width:420px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  .btn::after{animation:none;display:none}.message .caret{animation:none}#bgVideo,.screen,.days{transition:none}
}
</style>
</head>
<body data-style="dark">

<div class="bg" id="bgPoster"></div>
<video id="bgVideo" playsinline muted loop preload="auto" webkit-playsinline></video>
<div class="veil"></div>
<div class="frame"></div>
<canvas id="confetti"></canvas>

<main class="content" id="content" aria-live="polite">
  <div class="head">
    <h1 id="title"></h1>
    <div class="rule"></div>
    <div class="days" id="days"></div>
  </div>
  <div class="msg-wrap"><p class="message" id="message"></p></div>
  <div class="foot">
    <button class="music" id="musicBtn" hidden>إيقاف الموسيقى</button>
    <div class="sig" id="sig"></div>
  </div>
</main>

<!-- شاشة كلمة السر -->
<section class="screen" id="gate" hidden>
  <svg class="gift" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="26" width="48" height="30" rx="2"/><rect x="5" y="18" width="54" height="10" rx="2"/><path d="M32 18v38M32 18c-4-10-16-10-16-4 0 4 10 4 16 4zM32 18c4-10 16-10 16-4 0 4-10 4-16 4z"/></svg>
  <p class="to">الهدية دي محمية بكلمة سر</p>
  <form class="pw" id="pwForm">
    <input type="password" id="pwInput" placeholder="اكتب كلمة السر" autocomplete="off" aria-label="كلمة السر">
    <div class="err" id="pwErr" role="alert"></div>
    <button class="btn" type="submit">فتح</button>
  </form>
</section>

<!-- شاشة افتح هديتك -->
<section class="screen" id="cover" hidden>
  <svg class="gift" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="26" width="48" height="30" rx="2"/><rect x="5" y="18" width="54" height="10" rx="2"/><path d="M32 18v38M32 18c-4-10-16-10-16-4 0 4 10 4 16 4zM32 18c4-10 16-10 16-4 0 4-10 4-16 4z"/></svg>
  <p class="to" id="coverTo"></p>
  <button class="btn" id="openBtn" type="button">افتح هديتك</button>
  <p class="sub">ارفع صوت الموبايل قبل ما تفتح</p>
</section>

<!-- رسالة خطأ -->
<section class="screen" id="errorScreen" hidden>
  <p class="notice" id="errorText"></p>
</section>

<script>
/* SHA-256 (pure JS, same result everywhere) */
function sha256(str){
  var K=[],H=[],p=2,n=0,i,j;
  while(n<64){
    var prime=true;
    for(i=2;i*i<=p;i++){if(p%i===0){prime=false;break;}}
    if(prime){
      if(n<8)H.push((Math.sqrt(p)%1)*4294967296|0);
      K.push((Math.cbrt(p)%1)*4294967296|0);
      n++;
    }
    p++;
  }
  var b=Array.from(new TextEncoder().encode(str)),bitLen=b.length*8;
  b.push(0x80);
  while(b.length%64!==56)b.push(0);
  b.push(0,0,0,0,(bitLen>>>24)&255,(bitLen>>>16)&255,(bitLen>>>8)&255,bitLen&255);
  var w=new Array(64);
  for(var off=0;off<b.length;off+=64){
    for(i=0;i<16;i++)w[i]=(b[off+i*4]<<24)|(b[off+i*4+1]<<16)|(b[off+i*4+2]<<8)|b[off+i*4+3];
    for(i=16;i<64;i++){
      var x=w[i-15],y=w[i-2];
      var s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
      var s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(j=0;j<64;j++){
      var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      var ch=(e&f)^(~e&g);
      var t1=(h+S1+ch+K[j]+w[j])|0;
      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      var mj=(a&bb)^(a&c)^(bb&c);
      var t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(function(v){return('00000000'+(v>>>0).toString(16)).slice(-8);}).join('');
}

var DEMO = {
  n: '', s: 'gold',
  m: 'أنت دلوقتي كل حياتي، وكل دقيقة بتعدي جنبك بحس إنها بداية جديدة لينا.',
  v: 'video1.mp4'
};

var FOLDERS = { v: 'videos/', a: 'audio/', i: 'images/' };
var STYLES = ['gold', 'rose', 'dark', 'party'];

var $ = function (id) { return document.getElementById(id); };
var cfg = null, audio = null, typing = null;
var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function mediaPath(kind, name) {
  if (!name) return '';
  if (/^https?:\/\//i.test(name) || name.indexOf('/') !== -1) return name;
  return FOLDERS[kind] + encodeURIComponent(name);
}

function b64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

var LOCAL = {};

function loadConfig() {
  var p = new URLSearchParams(location.search);
  var d = p.get('d'), c = p.get('c');
  if (p.get('pv') === '1' && window.opener) {
    return new Promise(function (resolve) {
      var done = false;
      function fallback() {
        if (done) return; done = true;
        try { resolve(JSON.parse(b64urlDecode(d))); } catch (e) { resolve(DEMO); }
      }
      window.addEventListener('message', function (e) {
        if (done || e.source !== window.opener || !e.data || e.data.type !== 'gift-preview') return;
        done = true; LOCAL = e.data.files || {}; resolve(e.data.cfg || DEMO);
      });
      try { window.opener.postMessage({ type: 'ready' }, '*'); } catch (err) {}
      setTimeout(fallback, 1500);
    });
  }
  if (d) {
    try { return Promise.resolve(JSON.parse(b64urlDecode(d))); }
    catch (e) { return Promise.reject(new Error('bad')); }
  }
  if (c) {
    if (!/^[a-z0-9_-]{1,60}$/i.test(c)) return Promise.reject(new Error('bad'));
    return fetch('gifts/' + c + '.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('missing');
      return r.json();
    });
  }
  return Promise.resolve(DEMO);
}

function localOr(kind, name) {
  var f = LOCAL && LOCAL[kind];
  return f ? URL.createObjectURL(f) : mediaPath(kind, name);
}

function showError(text) {
  $('errorText').textContent = text;
  $('errorScreen').hidden = false;
  document.body.setAttribute('data-style', 'dark');
}

function applyStyle() {
  var s = STYLES.indexOf(cfg.s) >= 0 ? cfg.s : 'gold';
  document.body.setAttribute('data-style', s);
}

function setup() {
  applyStyle();
  var name = (cfg.n || '').trim();
  var title = name ? 'إلى: ' + name : 'هدية إليك';
  $('title').textContent = title;
  $('coverTo').textContent = name ? 'هدية خاصة إلى ' + name : 'عندك هدية';
  document.title = name ? 'هدية إلى ' + name : 'هدية خاصة';

  var img = localOr('i', cfg.i);
  if (img) {
    $('bgPoster').style.backgroundImage = 'url("' + img + '")';
    $('cover').style.setProperty('--poster', 'url("' + img + '")');
    $('cover').classList.add('cover-img');
  }

  var v = $('bgVideo'), vp = localOr('v', cfg.v);
  if (vp) {
    v.addEventListener('playing', function () { v.classList.add('on'); });
    v.addEventListener('error', function () { v.classList.remove('on'); v.hidden = true; });
    v.src = vp;
    v.load();
  } else {
    v.hidden = true;
  }

  if (cfg.dt && /^\d{4}-\d{2}-\d{2}$/.test(cfg.dt)) {
    var t = new Date(cfg.dt + 'T00:00:00'), now = new Date();
    now.setHours(0, 0, 0, 0);
    var diff = Math.round((now - t) / 86400000), n = Math.abs(diff);
    var label = diff >= 0 ? (cfg.dl || 'بقالنا {n} يوم سوا') : 'باقي {n} يوم';
    $('days').textContent = label.replace('{n}', n.toLocaleString('ar-EG'));
  }

  if (cfg.sig || cfg.wa) {
    var sig = $('sig');
    if (cfg.sig) sig.appendChild(document.createTextNode('صُنعت بواسطة ' + cfg.sig));
    var wa = String(cfg.wa || '').replace(/\D/g, '');
    if (wa) {
      if (cfg.sig) sig.appendChild(document.createElement('br'));
      var a = document.createElement('a');
      a.href = 'https://wa.me/' + wa;
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'اطلب هديتك على واتساب';
      sig.appendChild(a);
    }
  }

  if (cfg.a) {
    audio = new Audio();
    audio.loop = true;
    audio.preload = 'auto';
    audio.src = localOr('a', cfg.a);
    audio.addEventListener('error', function () { $('musicBtn').hidden = true; });
  }

  if (cfg.pw) { $('gate').hidden = false; $('pwInput').focus(); }
  else { $('cover').hidden = false; }
}

$('pwForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var val = $('pwInput').value.trim();
  if (sha256(val) === cfg.pw) {
    $('gate').classList.add('hide');
    $('cover').hidden = false;
  } else {
    $('pwErr').textContent = 'كلمة السر غلط، جرّب تاني';
    $('pwInput').select();
  }
});

function typeMessage(text) {
  var el = $('message');
  if (reduceMotion || !text) { el.textContent = text; return; }
  var chars = Array.from(text), i = 0;
  var base = Math.min(70, Math.max(26, 11000 / chars.length));
  var caret = document.createElement('span'); caret.className = 'caret';
  var node = document.createTextNode('');
  el.textContent = ''; el.appendChild(node); el.appendChild(caret);
  function step() {
    i++;
    node.nodeValue = chars.slice(0, i).join('');
    if (i >= chars.length) { typing = null; setTimeout(function () { if (caret.parentNode) caret.parentNode.removeChild(caret); }, 1500); return; }
    var ch = chars[i - 1], extra = /[.,،؛!؟?\n]/.test(ch) ? base * 5 : 0;
    typing = setTimeout(step, base + extra);
  }
  typing = setTimeout(step, 500);
  el.onclick = function () {
    if (typing) { clearTimeout(typing); typing = null; }
    el.textContent = text; el.onclick = null;
  };
}

function confetti() {
  if (reduceMotion) return;
  var cv = $('confetti'), ctx = cv.getContext('2d');
  function fit() { cv.width = innerWidth; cv.height = innerHeight; }
  fit();
  var colors = ['#ffd23f', '#ff5a5f', '#3ddc97', '#4cc9f0', '#f72585', '#ffffff'], parts = [];
  for (var i = 0; i < 110; i++) parts.push({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6,
    w: 6 + Math.random() * 6, h: 9 + Math.random() * 8,
    vx: -1 + Math.random() * 2, vy: 2 + Math.random() * 3.2,
    r: Math.random() * 6, vr: -.2 + Math.random() * .4,
    c: colors[i % colors.length]
  });
  var start = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    var alive = false;
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y < cv.height + 20) alive = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (alive && now - start < 9000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })(start);
}

$('openBtn').addEventListener('click', function () {
  $('cover').classList.add('hide');
  var v = $('bgVideo');
  if (!v.hidden && v.src) {
    v.muted = !!cfg.a ? true : false;
    var pr = v.play();
    if (pr && pr.catch) pr.catch(function () { v.muted = true; v.play().catch(function () {}); });
  }
  if (audio) {
    $('musicBtn').hidden = false;
    var ap = audio.play();
    if (ap && ap.then) {
      ap.catch(function () { $('musicBtn').textContent = 'تشغيل الموسيقى'; });
    }
  }
  typeMessage(cfg.m || '');
  $('days').classList.add('on');
  if (document.body.getAttribute('data-style') === 'party') confetti();
});

$('musicBtn').addEventListener('click', function () {
  if (!audio) return;
  if (audio.paused) { audio.play().catch(function () {}); this.textContent = 'إيقاف الموسيقى'; }
  else { audio.pause(); this.textContent = 'تشغيل الموسيقى'; }
});

addEventListener('resize', function () {
  var cv = $('confetti'); cv.width = innerWidth; cv.height = innerHeight;
});

loadConfig().then(function (c) { cfg = c || {}; setup(); }).catch(function () {
  showError('اللينك ده ناقص أو الهدية مش موجودة. اطلب من اللي بعتهالك اللينك يبعته تاني.');
});
</script>
</body>
</html>
